<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0F0C" />
    <script>
      // Pasang tema sebelum render supaya tidak berkedip. Default: gelap.
      (function () {
        var t = "dark";
        try { var s = localStorage.getItem("theme"); if (s === "light" || s === "dark") t = s; } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta name="description" content="Dashboard latihan & analisis statistik tim basket SMAN 9 Surabaya." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>Sembilan Basketball</title>
  </head>

  </body>
</html>
